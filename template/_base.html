<!DOCTYPE html>
<html>
<head>
<title>Lexington Irish Session</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/x-icon" href="{{ base_path }}static/images/fav.ico">
<link rel="stylesheet" href="{{ base_path }}static/css/w3.css">
<link rel="stylesheet" href="{{ base_path }}static/css/styles.css">
<html>
<head>
<title>Lexington Irish Session</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="{{ base_path }}static/css/w3.css">
<link rel="stylesheet" href="{{ base_path }}static/css/styles.css">
<script src="{{ base_path }}static/js/abcjs-basic-min.js"></script>
<style>
body {font-family: "Times New Roman", Georgia, Serif;}
h1, h2, h3 {
  font-family: "Playfair Display";
  letter-spacing: 5px;
}
h4, h5, h6 {
  font-family: "Playfair Display";
}
</style>

<!-- Additional CSS Content -->
{% block headCSS %}{% endblock %}

</head>
<body>

<!-- Navbar (sit on top) -->
<div class="w3-top">
  <div class="w3-bar w3-light-green w3-padding my-background">
  <a href="{{ base_path }}index.html" class="w3-bar-item w3-button w3-border-top w3-border-bottom w3-border-green w3-hover-white w3-round-xlarge w3-border" style="letter-spacing:4px;">Lexington Irish Session</a>
  <div class="w3-right">
    <a href="{{ base_path }}index.html#sets" class="w3-bar-item w3-button w3-hide-small w3-light-green w3-hover-white w3-round-xlarge w3-border w3-border-green">Sets</a>
    <a href="{{ base_path }}tune_index.html" class="w3-bar-item w3-button w3-hide-small w3-light-green w3-hover-white w3-round-xlarge w3-border w3-border-green">Tune Index</a>
  </div>
  <a href="javascript:void(0)" class="w3-bar-item w3-button w3-right w3-hide-large w3-hide-medium w3-hover-white w3-round-xlarge w3-border w3-border-green" onclick="hamburgerMenu()">&#9776;</a>
  </div>
  <div id="demo" class="w3-center w3-light-green w3-hide w3-hide-large w3-hide-medium my-background"
    style="margin-bottom:8px;"s>
    <a href="{{ base_path }}index.html#sets" class="w3-bar-item w3-button w3-light-green w3-hover-white w3-round-xlarge w3-border w3-border-green">Sets</a>
    <a href="{{ base_path }}tune_index.html" class="w3-bar-item w3-button w3-light-green w3-hover-white w3-round-xlarge w3-border w3-border-green">Tune Index</a>
  </div>
</div>

<!-- Page content -->
<div class="w3-content w3-padding-48" style="max-width:1100px">

  {% block content %}{% endblock %}
  
<!-- End page content -->
</div>

<!-- Footer -->
<footer class="w3-left-align w3-light-grey w3-padding-16 my-background">
  <p class="">@2025</p>
</footer>

<!-- After Javascript -->
{% block afterJavascript %}{% endblock %}
<script>
function hamburgerMenu() {
  var x = document.getElementById("demo");
  if (x.className.indexOf("w3-show") == -1) {
    x.className += " w3-show";
  } else { 
    x.className = x.className.replace(" w3-show", "");
  }
}
</script>

</body>
</html>
